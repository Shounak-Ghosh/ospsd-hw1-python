[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ospsd-hw1-python"
version = "0.1.0"
description = "OSPSD HW1 Python Project"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-api-python-client>=2.166.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "pytest-html>=4.0.0",
    "pytest-mock>=3.14.0",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "W",  # warnings
    "ANN",  # flake8-annotations
]
ignore = [
    "ANN401",  # Dynamically typed expressions are disallowed
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["calculator", "logger", "notifier"]

[tool.pytest.ini_options]
addopts = "-v"
testpaths = [
    "tests/integration",
    "tests/end_to_end",
    "src/calculator",
    "src/logger",
    "src/notifier"
]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true