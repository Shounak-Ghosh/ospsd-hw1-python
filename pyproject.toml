[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ospsd-hw4"
version = "0.1.0"
description = "Gmail client with AI integration"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-api-python-client>=2.166.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.0.0",
    "mypy>=1.0.0",
    "pytest-cov>=4.1.0",
    "pytest-html>=4.0.0",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "E501",  # Ignore line length issues since no need to go over 100 characters
    "W293", # White spaces are used for indentation in doc strings
    "S101", # Use of assertion should be okay in test files
    "D203", #incompatible with D211 
    "D213", #incompatible with D212
    "F811", # Allow function redefinition in tests
    "N803", # Allow uppercase parameter names to match Gmail API
    "A002", # Allow shadowing of built-in names in parameters
]
fixable = ["ALL"]  # Allow Ruff to auto-fix issues

[tool.setuptools]
packages = ["src", "src.components", "src.components.hw2_inbox", "src.components.ai_conversation_client"]
package-dir = {"" = "."}

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["src/components"]  
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src/components"]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
