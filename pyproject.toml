[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hw2_inbox"
version = "0.1.0"
description = "Gmail client implementation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-api-python-client>=2.166.0",
    "google-auth>=2.28.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.0.0",
    "mypy>=1.0.0",
    "pytest-cov>=4.1.0",
    "pytest-html>=4.0.0",
    "ruff"
]

[tool.uv.workspace]
members = ["hw2_inbox_api", "hw2_inbox_impl", "hw2_tests", "integration", "ai_conversation_client"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "E501",  # Ignore line length issues since no need to go over 100 characters
    "W293", # White spaces are used for indentation in doc strings
    "S101", # Use of assertion should be okay in test files
    "D203", #incompatible with D211 
    "D213", #incompatible with D212
    "F811", # Allow function redefinition in tests
    "N803", # Allow uppercase parameter names to match Gmail API
    "A002", # Allow shadowing of built-in names in parameters
]
fixable = ["ALL"]  # Allow Ruff to auto-fix issues

[tool.setuptools]
packages = ["hw2_inbox_impl", "hw2_inbox_api", "integration", "ai_conversation_client"]
package-dir = {"hw2_inbox_impl" = "hw2_inbox_impl/src/hw2_inbox_impl", "hw2_inbox_api" = "hw2_inbox_api/src/hw2_inbox_api", "integration" = "integration/src/integration", "ai_conversation_client" = "ai_conversation_client/src/ai_conversation_client"}

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["hw2_tests"]  
python_files = ["test_*.py"]
pythonpath = [
    "hw2_inbox_api/src",
    "hw2_inbox_impl/src",
    "ai_conversation_client/src",
    "integration/src"
]

[tool.coverage.run]
source = ["hw2_inbox_impl", "hw2_inbox_api"]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true