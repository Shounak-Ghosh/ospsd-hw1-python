[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hw2_inbox_package"
version = "0.1.0"
description = "Gmail client implementation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-api-python-client>=2.166.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "pytest-html>=4.0.0",
    "pytest-mock>=3.14.0",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "W",  # warnings
    "ANN",  # flake8-annotations
]
ignore = [
    "ANN401",  # Dynamically typed expressions are disallowed
]

[tool.setuptools]
packages = ["hw2_inbox_package", "hw2_inbox_package.implementation", "hw2_inbox_package.interface"]
package-dir = {"" = "."}

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["hw2_inbox_package/tests"]
python_files = ["test_*.py"]
pythonpath = [".", "hw2_inbox_package"]

[tool.coverage.run]
source = ["hw2_inbox_package"]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true