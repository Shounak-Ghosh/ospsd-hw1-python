[project]
name = "implementation"
version = "0.1.0"
description = "Gmail client implementation"
requires-python = ">=3.9"

[dependencies]
interface = { workspace = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
package-dir = {"" = "."}

[tool.pytest.ini_options]
pythonpath = ["."] 