[project]
name = "implementation"
version = "0.1.0"
description = "Gmail client implementation"
requires-python = ">=3.9"

[dependencies]
interface = { workspace = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "E501",  # Ignore line length issues since no need to go over 100 characters
    "ANN101", # Ignore missing type annotation for `self`
    "D103",  # Ignore missing docstrings (test functions should be self-explanatory)
    "D100",
    "D101",
    "D107",
    "D212",
    "W293" # White spaces are used for indentation in doc strings
]
fixable = ["ALL"]  # Allow Ruff to auto-fix issues

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true  # Ignore missing imports (some external libraries may lack type hints)

[tool.setuptools]
packages = ["src"]
package-dir = {"" = "."}

[tool.pytest.ini_options]
pythonpath = ["."] 